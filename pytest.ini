# pytest.ini
[pytest]
; minversion = 7.0

# Default command-line options (applied every run)
addopts = -ra -q --strict-markers --strict-config -v

# Directories to search for tests
testpaths =
    tests
    ; integration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to skip during recursion
norecursedirs = venv build .git

# Register custom markers (prevents warnings)
; markers =
;     slow: marks tests as slow (deselect with '-m "not slow"')
;     integration: marks integration tests
;     smoke: quick smoke tests

# Environment variables (requires pytest-env plugin)
env =
    APP_ENV=test

; # Warning filters
; filterwarnings =
;     ignore::DeprecationWarning
;     ignore::PendingDeprecationWarning

; # Logging
; log_cli = true
; log_cli_level = INFO
; log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
; log_date_format = %Y-%m-%d %H:%M:%S

; # Treat xfail as failure if it unexpectedly passes
; xfail_strict = true   